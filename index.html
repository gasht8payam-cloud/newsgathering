<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsroom Command Dashboard</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171f;--mu:#667085;--bd:#e3e6ec;--ac:#c8102e;--ok:#12805c;--wn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b23;--tx:#e8eaf0;--mu:#8b93a5;--bd:#262c38;--ac:#ff4d63;--ok:#34d399;--wn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
.logo{font-weight:800;color:var(--ac)}.logo b{color:var(--ac)}.sp{flex:1}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer;background:var(--card)}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.on{background:var(--tx);color:var(--bg)}
main{padding:16px;display:grid;gap:14px;max-width:1500px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.n{font-size:26px;font-weight:700}.l,.meta{color:var(--mu);font-size:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);margin:0 0 10px}
.f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.list{max-height:520px;overflow:auto}
.item{border-top:1px solid var(--bd);padding:10px 0}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:3px 0 6px}
.P1{color:var(--ac);font-weight:700}.P2{color:var(--wn);font-weight:700}.v{color:var(--ok)}.u{color:var(--wn)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--bg);border-radius:10px;padding:8px;min-height:100px}.col h3{margin:0 0 6px;font-size:12px;color:var(--mu)}
.st{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:6px}
table{width:100%;border-collapse:collapse}td,th{text-align:start;padding:6px 4px;border-top:1px solid var(--bd)}
#login{max-width:340px;margin:12vh auto;display:grid;gap:10px}.hide{display:none}
</style></head><body>
<div id="login" class="card hide"><div class="logo" data-i="logo">NEWSROOM</div><select class="langsel"><option value="ckb">کوردی</option><option value="en">English</option></select>
<input id="em" type="email" placeholder="Email" data-ph="email"><input id="pw" type="password" placeholder="Password (min 6)" data-ph="password">
<button class="p" id="in" data-i="signin">Sign in</button><div id="msg" class="meta"></div></div>
<div id="app" class="hide">
<header><div class="logo" data-i="logo">NEWSROOM</div><input id="q" placeholder="Search feed…" data-ph="search"><span class="sp"></span><select class="langsel"><option value="ckb">کوردی</option><option value="en">English</option></select>
<span id="who" class="meta"></span>
<select id="mystatus"><option value="available">Available</option><option value="on_assignment">On assignment</option><option value="live">Live</option><option value="break">Break</option></select>
<button id="out" data-i="signout">Sign out</button></header>
<main><section class="kpis" id="kpis"></section>
<section class="card"><h2 data-i="incoming">Incoming feed</h2><div class="f" id="fl"></div><div class="list" id="feed"></div></section>
<section class="card"><h2 data-i="pipeline">Story pipeline</h2><div class="kan" id="kan"></div></section>
<section class="card"><h2 data-i="team">Team on duty</h2><table id="crew"></table></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
